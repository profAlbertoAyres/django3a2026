{% extends 'base_site.html' %}

{% block title %}Entrar | Personal Trainer{% endblock %}

{% block content %}
<section class="py-secao">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card card-fitness shadow-sm">
          <div class="card-body p-4">
            <h2 class="titulo-secao mb-4">Entrar</h2>

            {% if form.errors %}
              <div class="alert alert-danger">
                <i class="bi bi-exclamation-triangle-fill me-1"></i>
                Usuário ou senha inválidos.
              </div>
            {% endif %}

            <form method="post">
              {% csrf_token %}

              <div class="mb-3">
                <label class="form-label fw-semibold">Usuário</label>
                {{ form.username }}
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold">Senha</label>
                {{ form.password }}
              </div>

              <input type="hidden" name="next" value="{{ next }}">

              <button type="submit" class="btn btn-fitness w-100">
                <i class="bi bi-box-arrow-in-right me-1"></i>Entrar
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
